[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automl_platform"
version = "0.1.0"
description = "Production Grade AI Data Analyst System"
dependencies = [
    "polars",
    "pydantic",
    "pytest",
    "fastapi"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "app*", "workers*"]